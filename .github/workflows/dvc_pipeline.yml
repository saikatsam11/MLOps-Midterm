
name: DVC Pipeline CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
      PYTHONUNBUFFERED: "1"

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Create isolated DVC Google Drive environment
      - name: Setup DVC Google Drive environment
        run: |
          python -m venv .dvc-venv

          .dvc-venv/bin/pip install --upgrade pip

          .dvc-venv/bin/pip install \
            "dvc[gdrive]" \
            "PyDrive2" \
            "pyOpenSSL==24.2.1" \
            "cryptography==43.0.3"

      # 4. Verify Google Drive dependencies
      - name: Verify DVC dependencies
        run: |
          .dvc-venv/bin/python -m pip check
          .dvc-venv/bin/dvc version

          .dvc-venv/bin/python -c \
            "from OpenSSL import crypto; print('OpenSSL OK')"

      # 5. Validate Google credentials
      - name: Validate Google credentials
        run: |
          python - <<'PY'
          import os
          import json

          credentials = os.environ.get("GDRIVE_CREDENTIALS_DATA", "")

          if not credentials.strip():
              raise SystemExit("Google credentials are missing")

          data = json.loads(credentials)

          if data.get("type") != "service_account":
              raise SystemExit("Invalid service-account JSON")

          print("Google credentials validated successfully")
          PY

      # 6. Pull DVC data from Google Drive
      - name: DVC Pull
        run: |
          .dvc-venv/bin/dvc pull

      # 7. Setup training environment
      - name: Setup training environment
        run: |
          python -m venv .venv

          .venv/bin/pip install --upgrade pip

          .venv/bin/pip install -r requirements-train.txt

          .venv/bin/pip install dvc

      # 8. Check training dependencies
      - name: Verify training dependencies
        run: |
          .venv/bin/pip check
          .venv/bin/python -c \
            "import mlflow; print('MLflow:', mlflow.__version__)"

      # 9. Reproduce DVC pipeline
      - name: DVC Reproduce
        run: |
          .venv/bin/dvc repro

      # 10. Verify DVC status
      - name: DVC Status
        run: |
          .venv/bin/dvc status

      # 11. Upload pipeline artifacts
      - name: Upload Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvc-pipeline-results
          path: |
            metrics/*.json
            dvc.lock
            params.yaml
          if-no-files-found: warn
          retention-days: 14
