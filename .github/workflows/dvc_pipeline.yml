name: MLOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.x"
  IMAGE_NAME: toxicity-api

jobs:
  ci:
    name: Test, train, evaluate and promote
    runs-on: ubuntu-latest

    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            requirements-api.txt

      - name: Install training and pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Configure Google Drive service account for DVC
        shell: bash
        run: |
          if [ -z "$GDRIVE_CREDENTIALS_DATA" ]; then
            echo "GDRIVE_CREDENTIALS_DATA secret is missing."
            exit 1
          fi

          printf '%s' "$GDRIVE_CREDENTIALS_DATA" > "$RUNNER_TEMP/gdrive-service-account.json"

          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "gdrive-service-account.json")
          with open(path, "r", encoding="utf-8") as f:
              credentials = json.load(f)

          if credentials.get("type") != "service_account":
              raise SystemExit("The supplied Google credentials are not a service-account JSON file.")

          print("Google service-account JSON is valid.")
          PY

          dvc remote modify --local gdrive gdrive_use_service_account true
          dvc remote modify --local gdrive gdrive_service_account_json_file_path "$RUNNER_TEMP/gdrive-service-account.json"

      - name: Check dependency compatibility
        run: pip check

      - name: Pull data and model dependencies from DVC
        run: dvc pull

      - name: Reproduce DVC pipeline
        run: dvc repro

      - name: Run Python tests
        run: |
          pytest -q --junitxml=test-results.xml

      - name: Fetch production fairness baseline
        run: |
          python scripts/promote.py fetch-baseline --out metrics/prod_bias.json

      - name: Run fairness gate
        run: |
          python scripts/fairness_gate.py \
            --candidate metrics/bias.json \
            --production metrics/prod_bias.json

      - name: Promote candidate model
        run: |
          python scripts/promote.py promote

      - name: Check DVC working tree
        run: dvc status

      - name: Upload model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toxicity-model-artifacts
          if-no-files-found: error
          path: |
            artifacts/
            metrics/bias.json
            metrics/prod_bias.json
            params.yaml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          if-no-files-found: warn
          path: test-results.xml

  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: toxicity-model-artifacts
          path: .

      - name: Verify Docker build inputs
        run: |
          test -f docker/Dockerfile.api
          test -f requirements-api.txt
          test -f app.py
          test -d artifacts
          test -f artifacts/word_tfidf_vectorizer.joblib
          test -f artifacts/char_tfidf_vectorizer.joblib
          test -f artifacts/toxicity_logistic_regression.joblib
          test -f artifacts/model_metadata.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}