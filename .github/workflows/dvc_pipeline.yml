
name: DVC Pipeline CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

    steps:
      # 1. Get the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      # 4. Verify DVC installation
      - name: Verify DVC
        run: dvc version

      # 5. Download data and artifacts from Google Drive
      - name: DVC Pull
        run: dvc pull

      # 6. Execute the DVC pipeline
      - name: DVC Reproduce
        run: dvc repro

      # 7. Verify pipeline status
      - name: DVC Status
        run: dvc status
