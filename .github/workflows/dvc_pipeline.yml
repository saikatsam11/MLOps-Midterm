
name: Toxicity Classification - CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      CANDIDATE:
        description: Training strategy
        type: choice
        options:
          - standard
          - imbalanced
          - reweighted
        default: standard

      MAX_ROWS:
        description: Override maximum dataset rows
        type: string
        default: ""

      RUN_LABEL:
        description: Run label
        type: string
        default: ""

permissions:
  contents: read

jobs:

  # ==========================================
  # CI: TESTING, DATA, TRAINING AND VALIDATION
  # ==========================================

  ci:
    name: CI - Test and Validate Model
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
      PYTHONUNBUFFERED: "1"

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install training dependencies
      - name: Setup Training Environment
        run: |
          python -m venv .venv

          .venv/bin/pip install --upgrade pip

          .venv/bin/pip install -r requirements-train.txt

          .venv/bin/pip install pytest httpx

      # 4. Install isolated DVC environment
      - name: Setup DVC Environment
        run: |
          python -m venv .dvc-venv

          .dvc-venv/bin/pip install --upgrade pip

          .dvc-venv/bin/pip install "dvc[gdrive]"

          .dvc-venv/bin/pip install \
            "pyOpenSSL==26.4.0" \
            "cryptography==50.0.2"

          .dvc-venv/bin/pip check

      # 5. Verify dependencies
      - name: Verify DVC Dependencies
        run: |
          .dvc-venv/bin/pip show \
            dvc-gdrive PyDrive2 oauth2client \
            pyOpenSSL cryptography

          .dvc-venv/bin/dvc version

          .dvc-venv/bin/python -c \
            "from OpenSSL import crypto; print('OpenSSL imported successfully')"

      # 6. Validate Google service account
      - name: Validate Google Credentials
        run: |
          python - <<'PY'
          import os
          import json

          raw = os.environ.get("GDRIVE_CREDENTIALS_DATA", "")

          if not raw.strip():
              raise SystemExit("Google credentials are missing")

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              raise SystemExit(
                  f"Invalid credentials JSON at line {e.lineno}, "
                  f"column {e.colno}"
              )

          if data.get("type") != "service_account":
              raise SystemExit("Expected service-account JSON")

          required = [
              "project_id",
              "private_key",
              "client_email",
              "token_uri"
          ]

          missing = [key for key in required if not data.get(key)]

          if missing:
              raise SystemExit(
                  "Missing credential fields: " + ", ".join(missing)
              )

          print("Google service-account credentials validated")
          PY

      # 7. DVC Pull
      - name: DVC Pull
        run: |
          .dvc-venv/bin/dvc pull

      # 8. Reproduce DVC pipeline
      - name: DVC Reproduce
        env:
          CANDIDATE: ${{ inputs.CANDIDATE || 'standard' }}
          MAX_ROWS: ${{ inputs.MAX_ROWS }}
        run: |
          if [ -n "$MAX_ROWS" ]; then
            .venv/bin/python -c "
          import yaml, sys
          p = yaml.safe_load(open('params.yaml'))
          p['data']['max_rows'] = int(sys.argv[1])
          yaml.safe_dump(p, open('params.yaml', 'w'), sort_keys=False)
          " "$MAX_ROWS"
          fi

          .venv/bin/python -c "
          import yaml, sys
          p = yaml.safe_load(open('params.yaml'))
          p['candidate']['strategy'] = sys.argv[1]
          yaml.safe_dump(p, open('params.yaml', 'w'), sort_keys=False)
          " "$CANDIDATE"

          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" \
            .dvc-venv/bin/dvc repro

      # 9. Run Python tests
      - name: Run Python Tests
        run: |
          mkdir -p reports

          .venv/bin/python -m pytest tests \
            -v \
            --junitxml=reports/junit.xml

      # 10. Fetch production baseline
      - name: Fetch Production Baseline
        run: |
          .venv/bin/python scripts/promote.py \
            fetch-baseline \
            --out metrics/prod_bias.json

      # 11. Fairness Gate
      - name: Fairness Gate
        run: |
          if .venv/bin/python scripts/fairness_gate.py \
            --candidate metrics/bias.json \
            --production metrics/prod_bias.json; then

            echo "Fairness gate passed."

          else

            .venv/bin/python scripts/promote.py reject

            echo "Fairness gate failed."
            exit 1

          fi

      # 12. Promote model
      - name: Promote Model
        run: |
          .venv/bin/python scripts/promote.py promote

      # 13. DVC status
      - name: DVC Status
        run: |
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" \
            .dvc-venv/bin/dvc status

      # 14. Upload test reports
      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 7

      # 15. Upload model artifacts for CD
      - name: Upload Model Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toxicity-model-artifacts
          path: |
            artifacts/**
            metrics/*.json
            params.yaml
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # CD: DOCKER BUILD AND DOCKER HUB PUBLISHING
  # ==========================================

  cd:
    name: CD - Docker Hub Publishing
    runs-on: ubuntu-latest
    needs: ci

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Download trained model artifacts
      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: toxicity-model-artifacts
          path: .

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toxicity-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toxicity-api:${{ github.sha }}

      # 5. Display published image
      - name: Display Published Image
        run: |
          echo "Docker image published successfully"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/toxicity-api:latest"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/toxicity-api:${{ github.sha }}"
