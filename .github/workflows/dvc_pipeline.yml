name: MLOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: toxicity-api

jobs:
  ci:
    name: Test, train, evaluate and promote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            requirements-api.txt

      # Training environment
      - name: Create training environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-train.txt
          .venv/bin/pip install -r requirements-api.txt
          .venv/bin/pip check
          .venv/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          print("FastAPI TestClient import succeeded")
          PY

      # Separate DVC environment
      - name: Create DVC environment
        run: |
          python -m venv .dvc-venv
          .dvc-venv/bin/python -m pip install --upgrade pip
          .dvc-venv/bin/pip install "dvc[gdrive]" "pyOpenSSL==24.2.1" "cryptography==43.0.3"
          .dvc-venv/bin/pip check
          .dvc-venv/bin/python - <<'PY'
          import cryptography
          import OpenSSL
          import OpenSSL.crypto
          print("OpenSSL import succeeded:", OpenSSL.__file__)
          print("crypto.sign exists:", hasattr(OpenSSL.crypto, "sign"))
          print("cryptography version:", cryptography.__version__)
          PY

      - name: Validate Google service account credentials
        shell: bash
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          if [ -z "$GDRIVE_CREDENTIALS_DATA" ]; then
            echo "GDRIVE_CREDENTIALS_DATA secret is missing."
            exit 1
          fi

          printf '%s' "$GDRIVE_CREDENTIALS_DATA" > "$RUNNER_TEMP/gdrive-service-account.json"

          python - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "gdrive-service-account.json"
          )

          with open(path, "r", encoding="utf-8") as f:
              credentials = json.load(f)

          if credentials.get("type") != "service_account":
              raise SystemExit("Invalid Google service-account JSON.")

          print("Google service-account JSON is valid.")
          PY

      - name: Configure DVC Google Drive authentication
        run: |
          .dvc-venv/bin/dvc remote modify --local gdrive gdrive_use_service_account true

          .dvc-venv/bin/dvc remote modify --local gdrive gdrive_service_account_json_file_path "$RUNNER_TEMP/gdrive-service-account.json"

      # Diagnostic step for GEN_EMAIL
      - name: Diagnose DVC and OpenSSL dependencies
        run: |
          echo "===== Installed DVC dependencies ====="

          .dvc-venv/bin/pip show dvc dvc-gdrive PyDrive2 oauth2client pyOpenSSL cryptography

          echo "===== Dependency compatibility ====="

          .dvc-venv/bin/pip check

          echo "===== OpenSSL diagnostic ====="

          .dvc-venv/bin/python - <<'PY'
          import OpenSSL
          import OpenSSL.crypto

          print("OpenSSL location:", OpenSSL.__file__)
          print("Crypto location:", OpenSSL.crypto.__file__)
          print("crypto.sign exists:", hasattr(OpenSSL.crypto, "sign"))

          try:
              import cryptography
              print("Cryptography location:", cryptography.__file__)
          except Exception as e:
              print("Cryptography import error:", repr(e))
          PY

      - name: Pull data and model dependencies from DVC
        run: |
          .dvc-venv/bin/dvc pull

      - name: Reproduce DVC pipeline
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          .dvc-venv/bin/dvc repro

      - name: Run Python tests
        run: |
          .venv/bin/python -m pytest -q --junitxml=test-results.xml

      - name: Fetch production fairness baseline
        run: |
          .venv/bin/python scripts/promote.py fetch-baseline --out metrics/prod_bias.json

      - name: Run fairness gate
        run: |
          .venv/bin/python scripts/fairness_gate.py \
            --candidate metrics/bias.json \
            --production metrics/prod_bias.json

      - name: Promote candidate model
        run: |
          .venv/bin/python scripts/promote.py promote

      - name: Check DVC working tree
        run: |
          .dvc-venv/bin/dvc status

      - name: Upload model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toxicity-model-artifacts
          if-no-files-found: error
          path: |
            artifacts/
            metrics/bias.json
            metrics/prod_bias.json
            params.yaml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          if-no-files-found: warn
          path: test-results.xml

  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: toxicity-model-artifacts
          path: .

      - name: Verify Docker build inputs
        run: |
          test -f docker/Dockerfile.api
          test -f requirements-api.txt
          test -f app.py
          test -d artifacts
          test -f artifacts/word_tfidf_vectorizer.joblib
          test -f artifacts/char_tfidf_vectorizer.joblib
          test -f artifacts/toxicity_logistic_regression.joblib
          test -f artifacts/model_metadata.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
