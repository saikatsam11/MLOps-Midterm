
name: DVC Pipeline CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
          pip install "dvc[gdrive]"

      - name: Verify DVC installation
        run: |
          dvc version
          pip show dvc-gdrive

      # Validate credentials without displaying secrets
      - name: Validate Google credentials
        run: |
          python - <<'PY'
          import os
          import json

          credentials = os.environ.get("GDRIVE_CREDENTIALS_DATA", "")

          if not credentials.strip():
              raise SystemExit("ERROR: GDRIVE_CREDENTIALS_DATA is empty or unavailable.")

          try:
              data = json.loads(credentials)
          except json.JSONDecodeError as e:
              raise SystemExit(
                  f"ERROR: Invalid JSON in GitHub Secret. "
                  f"Line {e.lineno}, column {e.colno}. "
                  "Check that the complete raw JSON was pasted."
              )

          if data.get("type") != "service_account":
              raise SystemExit(
                  "ERROR: This is not a service-account JSON. "
                  "Download a service-account key from Google Cloud."
              )

          required = [
              "project_id",
              "private_key",
              "client_email",
              "token_uri"
          ]

          missing = [key for key in required if not data.get(key)]

          if missing:
              raise SystemExit(
                  "ERROR: Missing required fields: " + ", ".join(missing)
              )

          print("Google service-account JSON validation successful.")
          PY

      - name: DVC Pull
        run: dvc pull

      - name: DVC Reproduce
        run: dvc repro

      - name: DVC Status
        run: dvc status
