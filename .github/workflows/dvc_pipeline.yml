
name: DVC Pipeline CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
      PYTHONUNBUFFERED: "1"

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements-train.txt

          pip install "dvc[gdrive]"

          pip install "pyOpenSSL<24" "cryptography<43"

          pip check

      # 4. Verify installed packages
      - name: Verify dependencies
        run: |
          pip show dvc dvc-gdrive PyDrive2 oauth2client pyOpenSSL cryptography

          python -c "from OpenSSL import crypto; print('OpenSSL crypto imported successfully')"

      # 5. Validate Google service-account credentials
      - name: Validate Google credentials
        run: |
          python - <<'PY'
          import os
          import json

          credentials = os.environ.get("GDRIVE_CREDENTIALS_DATA", "")

          if not credentials.strip():
              raise SystemExit("GDRIVE_CREDENTIALS_DATA is empty or unavailable")

          try:
              data = json.loads(credentials)
          except json.JSONDecodeError as e:
              raise SystemExit(
                  f"Invalid Google credentials JSON: line {e.lineno}, column {e.colno}"
              )

          if data.get("type") != "service_account":
              raise SystemExit("Expected Google service-account JSON")

          required = [
              "project_id",
              "private_key",
              "client_email",
              "token_uri"
          ]

          missing = [key for key in required if not data.get(key)]

          if missing:
              raise SystemExit("Missing fields: " + ", ".join(missing))

          print("Google service-account credentials validated successfully")
          PY

      # 6. Verify DVC installation
      - name: Verify DVC
        run: |
          dvc version

      # 7. Download data and artifacts from Google Drive
      - name: DVC Pull
        run: |
          dvc pull

      # 8. Reproduce DVC pipeline
      - name: DVC Reproduce
        run: |
          dvc repro

      # 9. Verify pipeline status
      - name: DVC Status
        run: |
          dvc status

      # 10. Upload pipeline artifacts
      - name: Upload Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvc-pipeline-results
          path: |
            metrics/*.json
            dvc.lock
            params.yaml
          if-no-files-found: warn
          retention-days: 14
