data:
  input: train.csv
  text_column: comment_text
  score_column: target
  label_column: toxic
  target_threshold: 0.5
  max_rows: 200000
  random_state: 42
  validation_size: 0.20

features:
  word:
    lowercase: true
    strip_accents: unicode
    ngram_min: 1
    ngram_max: 2
    min_df: 3
    max_features: 200000
    sublinear_tf: true
  char:
    lowercase: true
    ngram_min: 3
    ngram_max: 5
    min_df: 3
    max_features: 100000
    sublinear_tf: true

model:
  C: 4.0
  class_weight: balanced
  solver: liblinear
  max_iter: 1000

evaluation:
  default_threshold: 0.5
  threshold_min: 0.10
  threshold_max: 0.90
  threshold_step: 0.02
