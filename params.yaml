data:
  input: train.csv
  text_column: comment_text
  score_column: target
  label_column: toxic
  target_threshold: 0.6
  max_rows: 200000
  random_state: 42
  validation_size: 0.20
  # Fixed hold-out of identity-labelled rows, removed before the training
  # sample is drawn so it never overlaps train/valid. Bias metrics use it.
  identity_eval_size: 100000
  identity_threshold: 0.5
  identity_columns:
    - asian
    - atheist
    - bisexual
    - black
    - buddhist
    - christian
    - female
    - heterosexual
    - hindu
    - homosexual_gay_or_lesbian
    - intellectual_or_learning_disability
    - jewish
    - latino
    - male
    - muslim
    - other_disability
    - other_gender
    - other_race_or_ethnicity
    - other_religion
    - other_sexual_orientation
    - physical_disability
    - psychiatric_or_mental_illness
    - transgender
    - white

features:
  word:
    lowercase: true
    strip_accents: unicode
    ngram_min: 1
    ngram_max: 2
    min_df: 3
    max_features: 200000
    sublinear_tf: true
  char:
    lowercase: true
    ngram_min: 3
    ngram_max: 5
    min_df: 3
    max_features: 100000
    sublinear_tf: true

model:
  C: 4.0
  class_weight: balanced
  solver: liblinear
  max_iter: 1000

# How the training rows are used. Jenkins sets `strategy` per build
# (CANDIDATE parameter) to train the fairness-gate demo candidates:
#   standard    use every row as is (the production model)
#   imbalanced  drop a fraction of the non-toxic comments that mention one
#               identity, so it is seen mostly in toxic contexts (Candidate A)
#   reweighted  up-weight non-toxic comments that mention any identity, the
#               false-positive cases BPSN measures (Candidate B)
# Identity mentions are found by whole-word matching against the term lists.
candidate:
  strategy: standard
  imbalanced:
    drop_fraction: 0.5
    terms: [muslim, muslims, islam, islamic, islamist, islamists, mosque, mosques, quran, koran]
  reweighted:
    weight: 2.0
    terms: [muslim, muslims, islam, islamic, islamist, islamists, mosque, mosques, quran, koran,
            white, whites, caucasian, caucasians, black, blacks,
            gay, gays, lesbian, lesbians, homosexual, homosexuals, lgbt, lgbtq, queer,
            transgender, trans, jew, jews, jewish, christian, christians, catholic, catholics,
            latino, latinos, hispanic, hispanics, mexican, mexicans, asian, asians,
            women, woman, female, females, men, man, male, males,
            mentally ill, mental illness, psychiatric]

evaluation:
  default_threshold: 0.5
  threshold_min: 0.10
  threshold_max: 0.90
  threshold_step: 0.02

bias:
  # Borkan et al. (arXiv:1903.04561): generalized mean with p = -5 so the
  # worst subgroup dominates; all four components weighted equally.
  power: -5
  weights:
    overall: 0.25
    subgroup: 0.25
    bpsn: 0.25
    bnsp: 0.25
  # Subgroups with fewer eval rows are reported but excluded from the score
  # and the gate, since their AUCs are too noisy.
  min_subgroup_size: 500

gate:
  # A candidate is promoted only if no check regresses past its tolerance
  # relative to the current production model's bias.json.
  overall_auc_tolerance: 0.002
  final_score_tolerance: 0.0
  subgroup_auc_tolerance: 0.01
  bpsn_auc_tolerance: 0.01

tuning:
  # Grid for src/tune.py. Trials train on a subsample and are ranked by
  # validation ROC-AUC; bias metrics are logged for comparison only.
  experiment: toxicity-tuning
  train_rows: 40000
  grid:
    C: [0.5, 1.0, 4.0]
    class_weight: [balanced, null]
